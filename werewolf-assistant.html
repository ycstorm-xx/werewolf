<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="x5-orientation" content="portrait">
<title>狼人杀</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f0f1a;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
  display: flex;
  flex-direction: column;
  padding: 16px 20px;
  position: relative;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 8px;
  flex-shrink: 0;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  color: #d4a853;
  letter-spacing: 4px;
}
header .subtitle {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}
.info-btn {
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #d4a853;
  background: rgba(212,168,83,0.1);
  color: #d4a853;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.info-btn:active { background: rgba(212,168,83,0.25); }
#randomPopup {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  cursor: pointer;
}
.random-popup-num {
  font-size: 72px;
  font-weight: 800;
  color: #d4a853;
  line-height: 1.2;
  background: rgba(20,16,28,0.95);
  border: 1px solid #d4a853;
  border-radius: 16px;
  padding: 32px 48px;
  min-width: 120px;
  text-align: center;
}
.random-popup-range {
  font-size: 13px;
  color: #a08060;
  margin-top: 10px;
}
.progress-container {
  margin: 12px 0 16px;
  flex-shrink: 0;
}
.progress-bar-bg {
  height: 4px;
  background: #2a2a4a;
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #d4a853, #e8c06a);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #999;
  margin-top: 6px;
}
.step-header {
  text-align: center;
  padding: 12px 0 8px;
  flex-shrink: 0;
}
.step-header .step-subtitle {
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}
.step-header .step-title {
  font-size: 22px;
  font-weight: 700;
  color: #f0e6d3;
}
.step-header .step-desc {
  font-size: 14px;
  color: #aaa;
  margin-top: 8px;
}
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 0;
  min-height: 0;
}
.number-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 8px 0;
}
.number-btn {
  border-radius: 12px;
  border: 2px solid #3a3a5a;
  background: rgba(255,255,255,0.04);
  color: #ccc;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 60px;
  padding: 8px;
}
.number-btn:active { transform: scale(0.95); }
.number-btn.available:hover { border-color: #d4a853; background: rgba(212,168,83,0.08); }
.number-btn.selected {
  border-color: #d4a853;
  background: rgba(212,168,83,0.2);
  color: #d4a853;
  box-shadow: 0 0 16px rgba(212,168,83,0.15);
}
.number-btn.assigned {
  border-color: #3a3a5a;
  background: rgba(255,255,255,0.05);
  color: #666;
  cursor: default;
  opacity: 0.6;
}
.number-btn.assigned .role-label {
  font-size: 9px;
  font-weight: 400;
  color: #888;
  margin-top: 2px;
}
.number-btn.disabled {
  border-color: #2a2a3a;
  background: rgba(255,255,255,0.02);
  color: #444;
  cursor: not-allowed;
  opacity: 0.4;
}
.number-btn.kill-target {
  border-color: #e74c3c;
  background: rgba(231,76,60,0.15);
  color: #e74c3c;
}
.number-btn.learn-target {
  border-color: #3498db;
  background: rgba(52,152,219,0.15);
  color: #3498db;
}
.number-btn .role-label {
  font-size: 9px;
  font-weight: 400;
  color: #aaa;
  margin-top: 2px;
}
.multi-count {
  text-align: center;
  font-size: 13px;
  color: #d4a853;
  margin-bottom: 12px;
  padding: 8px;
  background: rgba(212,168,83,0.08);
  border-radius: 8px;
}
.bottom-nav {
  display: flex;
  gap: 12px;
  padding: 16px 0 20px;
  flex-shrink: 0;
}
.btn {
  flex: 1;
  padding: 14px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn-suicide {
  flex: 0.5;
  padding: 14px 0;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  background: linear-gradient(135deg, #c0392b, #e74c3c);
  color: #fff;
}
.btn-suicide:active { transform: scale(0.97); opacity: 0.85; }

.btn-knight {
  flex: 0.5;
  padding: 14px 0;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  background: linear-gradient(135deg, #2471a3, #3498db);
  color: #fff;
}
.btn-knight:active { transform: scale(0.97); opacity: 0.85; }

.suicide-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,20,0.95);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}
.suicide-overlay.open { display: block; }
.suicide-modal {
  max-width: 380px;
  width: 100%;
  margin: 40px auto;
  background: rgba(255,255,255,0.04);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #2a2a4a;
}
.suicide-modal-header {
  font-size: 15px;
  font-weight: 700;
  color: #e74c3c;
  text-align: center;
  margin-bottom: 16px;
}
.suicide-cancel-btn {
  display: block;
  margin: 16px auto 0;
  padding: 10px 24px;
  border: 1px solid #3a3a5a;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  color: #aaa;
  font-size: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.suicide-cancel-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.97); }
.btn-prev {
  background: rgba(255,255,255,0.06);
  color: #aaa;
  border: 1px solid #3a3a5a;
}
.btn-prev:active { background: rgba(255,255,255,0.1); }
.btn-prev:disabled { opacity: 0.3; cursor: default; transform: none; }
.btn-next {
  background: linear-gradient(135deg, #d4a853, #c49a3f);
  color: #1a1a2e;
}
.btn-next:active { opacity: 0.9; }
.btn-next:disabled { opacity: 0.3; cursor: default; transform: none; }

.result-section {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.result-summary {
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid #2a2a4a;
}
.result-summary-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.result-summary-item:last-child { border-bottom: none; }
.result-summary-item .label { color: #888; }
.result-summary-item .value { color: #f0e6d3; font-weight: 600; }
.role-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #2a2a4a;
}
.role-table th {
  background: rgba(255,255,255,0.06);
  padding: 10px 8px;
  font-size: 13px;
  color: #888;
  font-weight: 600;
  text-align: center;
}
.role-table td {
  padding: 10px 8px;
  text-align: center;
  font-size: 14px;
  border-top: 1px solid #2a2a4a;
  background: rgba(255,255,255,0.02);
}
.role-table tr:nth-child(even) td { background: rgba(255,255,255,0.04); }
.role-tag-good { color: #2ecc71; font-weight: 600; }
.role-tag-wolf { color: #e74c3c; font-weight: 600; }
.role-tag-god { color: #3498db; font-weight: 600; }
.player-num { font-weight: 700; color: #d4a853; font-size: 16px; }
.kill-info {
  text-align: center;
  padding: 12px;
  margin: 12px 0;
  background: rgba(231,76,60,0.08);
  border-radius: 10px;
  border: 1px solid rgba(231,76,60,0.2);
}
.kill-info .kill-label { font-size: 13px; color: #888; }
.kill-info .kill-value { font-size: 20px; font-weight: 700; color: #e74c3c; margin-top: 4px; }
.duel-info { margin-top: 12px; padding: 12px 16px; border-radius: 8px; background: rgba(52,152,219,0.08); border: 1px solid rgba(52,152,219,0.3); }
.duel-info .duel-label { font-size: 13px; color: #888; }
.duel-info .duel-value { font-size: 16px; font-weight: 700; color: #3498db; margin-top: 4px; }
.learn-info {
  text-align: center;
  padding: 12px;
  margin: 12px 0;
  background: rgba(52,152,219,0.08);
  border-radius: 10px;
  border: 1px solid rgba(52,152,219,0.2);
}
.learn-info .learn-label { font-size: 13px; color: #888; }
.learn-info .learn-value { font-size: 20px; font-weight: 700; color: #3498db; margin-top: 4px; }
.action-card {
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid #2a2a4a;
}
.action-card .card-label {
  font-size: 13px;
  color: #888;
  margin-bottom: 10px;
}
.action-group {
  display: flex;
  gap: 10px;
}
.action-btn {
  flex: 1;
  padding: 14px 8px;
  border-radius: 10px;
  border: 2px solid #3a3a5a;
  background: rgba(255,255,255,0.04);
  color: #ccc;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.action-btn:active { transform: scale(0.97); }
.action-btn.active {
  border-color: #d4a853;
  background: rgba(212,168,83,0.2);
  color: #d4a853;
}
.action-btn.danger.active {
  border-color: #e74c3c;
  background: rgba(231,76,60,0.15);
  color: #e74c3c;
}
.action-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
}
.warning-note {
  text-align: center;
  padding: 10px;
  margin: 12px 0;
  background: rgba(231,76,60,0.06);
  border-radius: 8px;
  border: 1px solid rgba(231,76,60,0.15);
  color: #e74c3c;
  font-size: 14px;
}
.check-info, .save-info, .guard-info {
  text-align: center;
  padding: 12px;
  margin: 12px 0;
  border-radius: 10px;
}
.check-info { background: rgba(243,156,18,0.08); border: 1px solid rgba(243,156,18,0.2); }
.check-info .cv { font-size: 20px; font-weight: 700; color: #f39c12; margin-top: 4px; }
.save-info { background: rgba(46,204,113,0.08); border: 1px solid rgba(46,204,113,0.2); }
.save-info .sv { font-size: 20px; font-weight: 700; color: #2ecc71; margin-top: 4px; }
.guard-info { background: rgba(155,89,182,0.08); border: 1px solid rgba(155,89,182,0.2); }
.guard-info .gv { font-size: 20px; font-weight: 700; color: #9b59b6; margin-top: 4px; }
.info-label { font-size: 13px; color: #888; }
.reset-btn {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 16px;
  background: rgba(231,76,60,0.1);
  border: 1px solid rgba(231,76,60,0.3);
  border-radius: 10px;
  color: #e74c3c;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.reset-btn:active { background: rgba(231,76,60,0.2); }
.btn-img {
  display: block; width: 100%; padding: 12px; margin-top: 12px;
  border-radius: 10px; border: 1px solid #3498db;
  background: rgba(52,152,219,0.1); color: #3498db;
  font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center;
}
.btn-img:active { background: rgba(52,152,219,0.2); }
.btn-img:disabled { opacity: 0.4; cursor: not-allowed; }
.name-tag:hover { border-color: #d4a853 !important; background: rgba(212,168,83,0.08) !important; }
#newNameInput:focus { border-color: #d4a853 !important; }
.unbind-name:hover { color: #ff6b6b !important; }
.mvp-section {
  text-align: center;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(212,168,83,0.12) 0%, rgba(212,168,83,0.05) 100%);
  border: 1px solid rgba(212,168,83,0.3);
  box-shadow: 0 0 30px rgba(212,168,83,0.08), inset 0 0 30px rgba(212,168,83,0.04);
  position: relative;
  overflow: hidden;
}
.mvp-section::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 50% 50%, rgba(212,168,83,0.06) 0%, transparent 60%);
  animation: mvpGlow 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes mvpGlow {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
}
.mvp-crown {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  margin-bottom: 8px;
}
.mvp-crown svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 8px rgba(212,168,83,0.5));
}
.mvp-label {
  font-size: 11px;
  letter-spacing: 6px;
  font-weight: 700;
  color: rgba(212,168,83,0.6);
  margin-bottom: 8px;
  text-indent: 6px;
}
.mvp-names {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}
.mvp-name-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(212,168,83,0.15);
  border: 1px solid rgba(212,168,83,0.3);
  font-weight: 700;
  color: #f0e6d3;
  font-size: 15px;
  animation: mvpPulse 2s ease-in-out infinite;
}
@keyframes mvpPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(212,168,83,0.15); }
  50% { box-shadow: 0 0 20px rgba(212,168,83,0.3); }
}
.mvp-name-tag .num {
  color: #d4a853;
  font-size: 18px;
}
.mvp-name-tag .name-text {
  color: #f0e6d3;
}
.mvp-name-tag .mvp-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 8px;
  background: #d4a853;
  color: #1a1a2e;
  font-weight: 800;
  letter-spacing: 1px;
}
.mvp-divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(212,168,83,0.4), transparent);
  margin: 10px auto;
}
.mvp-co-label {
  font-size: 12px;
  color: rgba(212,168,83,0.5);
  letter-spacing: 2px;
}
.role-table tr.mvp-row td {
  background: rgba(212,168,83,0.1) !important;
  border-top-color: rgba(212,168,83,0.2);
}
.role-table tr.mvp-row .player-num {
  color: #f0c850;
  text-shadow: 0 0 12px rgba(212,168,83,0.3);
}
@media (max-width: 380px) {
  .app { padding: 12px 14px; }
  .number-grid { gap: 8px; }
  .number-btn { font-size: 18px; min-height: 50px; padding: 6px; }
  .step-header .step-title { font-size: 18px; }
}
@media (min-height: 800px) {
  .content { padding: 24px 0; }
  .number-grid { gap: 14px; }
  .number-btn { min-height: 70px; padding: 12px; }
}
.rules-section {
  padding: 8px 0;
}
.rules-section .rule-category {
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid #2a2a4a;
}
.rules-section .rule-cat-title {
  font-size: 15px;
  font-weight: 700;
  color: #d4a853;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2a2a4a;
}
.rules-section .rule-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.rules-section .rule-item:last-child { border-bottom: none; }
.rules-section .rule-desc { color: #ccc; flex: 1; }
.rules-section .rule-score {
  font-weight: 700;
  color: #d4a853;
  margin-left: 12px;
  white-space: nowrap;
}
.rules-section .rule-score.positive { color: #2ecc71; }
.rules-section .rule-score.negative { color: #e74c3c; }
.rules-section .rule-note {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  line-height: 1.6;
}
.rules-section .rule-sub {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}
.role-info-card {
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1px solid #2a2a4a;
}
.role-info-card:last-child { margin-bottom: 0; }
.role-info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.role-info-name {
  font-size: 16px;
  font-weight: 700;
  color: #f0e6d3;
}
.role-info-count {
  font-size: 12px;
  font-weight: 600;
}
.role-info-skill {
  font-size: 13px;
  color: #bbb;
  line-height: 1.7;
}
.state-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,20,0.95);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}
.state-overlay-inner {
  max-width: 480px;
  margin: 0 auto;
}
.state-overlay.open { display: block; }
.state-overlay .close-area {
  text-align: right;
  margin-bottom: 12px;
}
.state-overlay .close-btn {
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid #888;
  background: rgba(255,255,255,0.06);
  color: #ccc;
  cursor: pointer;
}
.state-overlay .close-btn:active { background: rgba(255,255,255,0.12); }
.log-entry {
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #2a2a4a;
}
.log-entry .log-round {
  font-size: 14px;
  font-weight: 700;
  color: #d4a853;
  margin-bottom: 8px;
}
.log-entry .log-phase {
  font-size: 13px;
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 6px;
}
.log-entry .log-night {
  background: rgba(52,152,219,0.08);
  border-left: 3px solid #3498db;
}
.log-entry .log-day {

<script src="tencent-docs-config.js"></script>
<script>
(function() {
  // ─── Constants / Board config ────────────────────────────────
  let boardType = 'mech';  // 'mech' | 'wolfking' | 'whitewolfking' | 'muteElder' | 'nightmare'

  let ROLES = {};
  function initRoles(board) {
    boardType = board;
    ROLES = board === 'wolfking' ? {
      seer:   { label: '预言家', type: 'god',  count: 1 },
      witch:  { label: '女巫',   type: 'god',  count: 1 },
      hunter: { label: '猎人',   type: 'god',  count: 1 },
      guard:  { label: '守卫',   type: 'god',  count: 1 },
      wolf:   { label: '狼人',   type: 'wolf', count: 3 },
      wolfKing: { label: '狼王', type: 'wolf', count: 1 },
      villager: { label: '平民', type: 'good', count: 4 },
    } : board === 'whitewolfking' ? {
      seer:   { label: '预言家', type: 'god',  count: 1 },
      witch:  { label: '女巫',   type: 'god',  count: 1 },
      hunter: { label: '猎人',   type: 'god',  count: 1 },
      guard:  { label: '守卫',   type: 'god',  count: 1 },
      wolf:   { label: '小狼',   type: 'wolf', count: 3 },
      whiteWolfKing: { label: '白狼王', type: 'wolf', count: 1 },
      villager: { label: '平民', type: 'good', count: 4 },
    } : board === 'muteElder' ? {
      seer:   { label: '预言家',     type: 'god',  count: 1 },
      witch:  { label: '女巫',       type: 'god',  count: 1 },
      knight: { label: '骑士',       type: 'god',  count: 1 },
      muteElder: { label: '禁言长老', type: 'god',  count: 1 },
      wolf:   { label: '狼人',       type: 'wolf', count: 4 },
      villager: { label: '平民',     type: 'good', count: 4 },
    } : board === 'nightmare' ? {
      seer:   { label: '预言家', type: 'god',  count: 1 },
      witch:  { label: '女巫',   type: 'god',  count: 1 },
      hunter: { label: '猎人',   type: 'god',  count: 1 },
      dreamweaver: { label: '摄梦人', type: 'god', count: 1 },
      wolf:   { label: '狼人',   type: 'wolf', count: 3 },
      nightmare: { label: '噩梦之影', type: 'wolf', count: 1 },
      villager: { label: '平民', type: 'good', count: 4 },
    } : {
      seer:   { label: '预言家', type: 'god',  count: 1 },
      witch:  { label: '女巫',   type: 'god',  count: 1 },
      hunter: { label: '猎人',   type: 'god',  count: 1 },
      guard:  { label: '守卫',   type: 'god',  count: 1 },
      wolf:   { label: '小狼',   type: 'wolf', count: 3 },
      mech:   { label: '机械狼', type: 'wolf', count: 1 },
      villager: { label: '平民', type: 'good', count: 4 },
    };
  }
  initRoles('mech');
  const TYPE_STYLES = {
    god:  { cls: 'role-tag-god',  label: '神职' },
    wolf: { cls: 'role-tag-wolf', label: '狼人' },
    good: { cls: 'role-tag-good', label: '平民' },
  };
  const TOTAL = 12;

  // ─── 角色简介 / 技能说明 ──────────────────────────────────────
  const ROLE_SKILLS = {
    seer:    '每晚可查验一名玩家的身份，获知其阵营（好人/狼人）。',
    witch:   '拥有一瓶解药和一瓶毒药。解药可救起当晚被狼刀的玩家（通常不可自救），毒药可毒杀一名玩家，两者各限用一次。',
    hunter:  '被狼人刀死或被放逐出局时，可开枪带走一名玩家；被女巫毒死时不能开枪。',
    guard:   '每晚可守护一名玩家，使其免受狼刀；不能连续两晚守护同一人。',
    knight:  '白天可对一名玩家发起决斗：若对方是狼人，则对方出局；否则骑士自己出局。',
    muteElder: '每晚可禁言一名玩家，使其次日白天无法发言；不能连续两晚禁言同一人。',
    dreamweaver: '每晚必须选择一名其他玩家梦游（不可选自己），梦游者免疫所有夜间伤害；连续两晚梦游同一人，该玩家梦游出局且无技能；若摄梦人死于夜间伤害，梦游者跟随出局且无技能；被恐惧会中断连续梦游。',
    mech:    '首夜学习一名玩家的身份，之后获得其技能（守卫/女巫/预言家），但始终属于狼人阵营。',
    wolfKing: '被放逐或被猎人开枪带走时，可开枪带走一名玩家。',
    whiteWolfKing: '自爆出局后，可开枪带走一名好人玩家。',
    nightmare: '每晚可恐惧一名玩家，使其当夜无法行动；恐惧到狼人则狼队无法袭击；不能连续两晚恐惧同一人；首夜与狼人互不知身份。',
    wolf:    '每晚与狼同伴共同刀杀一名玩家。',
    villager: '无特殊技能，靠推理与投票找出狼人。',
  };

  // ─── Tencent Docs API config (from external file) ──────────────
  const C = window.TENCENT_DOCS_CONFIG || {};
  const TD_FILE_ID = C.fileId || '';
  const TD_AUTH = C.auth || {};
  // Use /api/ proxy (server forwards to docs.qq.com, avoids CORS)
  // Falls back to direct API call if opened as plain file (file:// protocol)
  const TD_BASE = (window.location.protocol === 'file:')
    ? (C.apiBase || 'https://docs.qq.com/openapi/spreadsheet/v3/files')
    : '/api/spreadsheet/v3/files';

  // ─── State ──────────────────────────────────────────────────
  let assignments = {};      // { playerNum: roleKey }
  let killTarget = null;
  let learnTarget = null;
  let seerCheckTarget = null;
  let witchSaveAction = null;
  let witchPoisonActive = false;
  let witchPoisonTarget = null;
  let guardProtectTarget = null;
  let lastGuardTarget = null;
  let lastMuteTarget = null;
  let onBoard = [];
  let sheriff = null;
  let sheriffVoters = [];
  let banishedPlayer = null;
  let hunterShotTarget = null;
  let hunterRevengeTarget = null;
  let hunterCounterTarget = null; // real hunter counter-shot after killed by mech-hunter
  let wolfKingShotTarget = null;
  let whiteWolfKingShotTarget = null;
      let mechChainShotTarget = null;
  let mechHunterRevengeTarget = null; // mech learned hunter, killed by wolf knife at night
  let currentStep = 0;

  // Multi-round state
  let round = 1;
  let deadPlayers = [];
  let witchHasSave = true;
  let witchHasPoison = true;
  let mechNightAction = null;   // { type: 'shield'|'poison'|'check', target: num }
  let mechHasUsedPoison = false;
  let mechActionSkipped = false; // mech chose to skip its night skill this round
  let mechExtraKill = null;     // second kill target when mech is last wolf
  let mechExtraKillUsed = false; // ensures extra kill only triggers once
  let knightDuelTarget = null;   // knight's duel target (muteElder board)
  let dreamTarget = null;        // 摄梦人选中的梦游者 (nightmare board)
  let lastDreamTarget = null;    // 摄梦人上一晚梦游目标（连续两晚梦游判断）
  let dreamNoSkillDead = [];     // 因梦游出局/跟随摄梦人出局而无技能的玩家（本回合）
  let nightmareFearTarget = null; // 噩梦之影恐惧目标 (nightmare board)
  let lastNightmareTarget = null; // 上一晚恐惧目标（不能连续恐惧同一人）
  let gameWinner = null;
  let roundStartDeadCount = 0;   // deadPlayers.length at start of current round
  let gameLog = [];  // round-by-round record [{ round, night: {...}, day: {...} }]
  let wolfSuicide = null;     // wolf self-destruct
  let isDayPhase = false;       // true during day steps (show wolf suicide button)

  // ─── Name binding ────────────────────────────────────────────
  let namePool = ['yiwen', 'yanyan', 'zhenhua', 'jinghui', 'cf', 'cong', 'law', 'wf', 'tujian', 'shengkai', 'yc', 'nerissa', 'mao', 'yaxi', 'weixin', 'icey', 'yupeng', 'rr', 'zoubek'];
  let nameBindings = {};  // { seatNum: name }
  let selectedNameForBind = null;

  // ─── Scoring system ───────────────────────────────────────────
  let scores = {};          // { playerNum: totalScore }
  let scoreLog = [];        // [{ playerNum, points, reason, round }]
  let scoredRounds = {};    // { [round]: { night: true, day: true } }
  let gameEndScored = false;

  // ─── Helpers ────────────────────────────────────────────────
  function allAssignedNums() {
    return Object.keys(assignments).map(Number);
  }
  function grayedExcept(roleKey) {
    const exceptNums = getAssignedAll(roleKey);
    return allAssignedNums().filter(n => !exceptNums.includes(n));
  }
  function getAssigned(roleKey) {
    for (const [n, r] of Object.entries(assignments)) {
      if (r === roleKey) return Number(n);
    }
    return null;
  }
  function getAssignedAll(roleKey) {
    return Object.entries(assignments)
      .filter(([,r]) => r === roleKey)
      .map(([n]) => Number(n));
  }
  function assign(num, roleKey) { assignments[num] = roleKey; }
  function unassign(num) { delete assignments[num]; }
  function getRoleDisplay(num) {
    const rk = assignments[num];
    return rk ? (ROLES[rk] ? ROLES[rk].label : rk) : '?';
  }
  function getRoleDisplayFull(num) {
    const rk = assignments[num];
    let base = rk ? (ROLES[rk] ? ROLES[rk].label : rk) : '?';
    if (rk === 'mech' && learnTarget) base += '(学' + getRoleDisplay(learnTarget) + ')';
    return base;
  }
  function canShootAsHunter(num) {
    if (assignments[num] === 'hunter') return true;
    if (ROLES.mech && assignments[num] === 'mech' && learnTarget && getRoleDisplay(learnTarget) === '猎人') return true;
    return false;
  }
  function canShootAsWolfKing(num) {
    return assignments[num] === 'wolfKing';
  }
  function canHunterRevenge() {
    const hunter = getAssigned('hunter');
    if (hunter == null) return false;
    if (!isDead(hunter)) return false;
    const tonightDeaths = deadPlayers.slice(roundStartDeadCount);
    if (!tonightDeaths.includes(hunter)) return false;
    // Hunter was poisoned → cannot shoot
    if (witchPoisonTarget === hunter) return false;
    if (mechNightAction && mechNightAction.type === 'poison' && mechNightAction.target === hunter) return false;
    // 猎人被噩梦之影恐惧 → 当晚无法开夜枪
    if (nightmareFearTarget === hunter) return false;
    // 猎人因梦游出局/跟随摄梦人出局 → 无技能，不能开枪
    if (dreamNoSkillDead.indexOf(hunter) >= 0) return false;
    return killTarget === hunter;
  }
  function canMechHunterRevenge() {
    const mech = getAssigned('mech');
    if (mech == null) return false;
    if (!isDead(mech)) return false;
    if (!canShootAsHunter(mech)) return false; // mech learned hunter
    const tonightDeaths = deadPlayers.slice(roundStartDeadCount);
    if (!tonightDeaths.includes(mech)) return false;
    // Mech was poisoned → cannot shoot
    if (witchPoisonTarget === mech) return false;
    if (mechNightAction && mechNightAction.type === 'poison' && mechNightAction.target === mech) return false;
    return killTarget === mech;
  }
  function isMechDoubleKill() {
    // 机械狼学狼人、作为最后一只狼本轮进行了额外刀（双刀）
    return mechExtraKill > 0;
  }
  function canMechChainShot(num) {
    if (!num) return false;
    if (assignments[num] !== 'mech') return false;
    return learnTarget && getRoleDisplay(learnTarget) === '猎人';
  }
  function canWolfKingChainShot() {
    if (wolfKingShotTarget !== null) return null;
    if (hunterRevengeTarget && canShootAsWolfKing(hunterRevengeTarget)) return hunterRevengeTarget;
    if (hunterShotTarget && canShootAsWolfKing(hunterShotTarget)) return hunterShotTarget;
    return null;
  }
  function shouldHunterCounter() {
    // Real hunter was killed by a banishment-triggered shot
    // and hasn't counter-shot yet. Two cases:
    //   A) Mech-hunter banished, shot real hunter
    //   B) Wolf king banished, shot real hunter
    if (!banishedPlayer) return false;
    // Case A: mech-hunter
    if (assignments[banishedPlayer] === 'mech' && learnTarget && getRoleDisplay(learnTarget) === '猎人') {
      if (hunterShotTarget && assignments[hunterShotTarget] === 'hunter') return true;
    }
    // Case B: wolf king
    if (canShootAsWolfKing(banishedPlayer)) {
      if (wolfKingShotTarget && assignments[wolfKingShotTarget] === 'hunter') return true;
    }
    return false;
  }

  // ─── Multi-round helpers ─────────────────────────────────────
  function isDead(num) { return deadPlayers.indexOf(num) >= 0; }
  function addDeath(num) {
    if (num != null && deadPlayers.indexOf(num) < 0) deadPlayers.push(num);
  }
  function getAliveNums() {
    const r = [];
    for (let i = 1; i <= TOTAL; i++) { if (!isDead(i)) r.push(i); }
    return r;
  }
  function checkGameOver() {
    const aliveWolves = getAssignedAll('wolf').filter(n => !isDead(n)).length;
    const mechN = getAssigned('mech');
    const wkN = getAssigned('wolfKing');
    const wwkN = getAssigned('whiteWolfKing');
    const mechAlive = mechN != null && !isDead(mechN);
    const wkAlive = wkN != null && !isDead(wkN);
    const wwkAlive = wwkN != null && !isDead(wwkN);
    const nmN = getAssigned('nightmare');
    const nmAlive = nmN != null && !isDead(nmN);
    if (aliveWolves === 0 && !mechAlive && !wkAlive && !wwkAlive && !nmAlive) return 'good';
    const gods = boardType === 'muteElder' ? ['seer','witch','knight','muteElder']
      : boardType === 'nightmare' ? ['seer','witch','hunter','dreamweaver']
      : ['seer','witch','hunter','guard'];
    const deadGods = gods.filter(rk => {
      const n = getAssigned(rk);
      return n != null && isDead(n);
    }).length;
    if (deadGods === gods.length) return 'wolf';
    const villagers = getAssignedAll('villager');
    if (villagers.length > 0 && villagers.filter(n => isDead(n)).length === villagers.length) return 'wolf';
    return null;
  }

  // ─── Scoring helpers ───────────────────────────────────────────
  function isWolfFactionNum(num) {
    if (num == null) return false;
    const rk = assignments[num];
    return rk === 'wolf' || rk === 'mech' || rk === 'wolfKing' || rk === 'whiteWolfKing' || rk === 'nightmare';
  }
  function isGodNum(num) {
    if (num == null) return false;
    const rk = assignments[num];
    return rk === 'seer' || rk === 'witch' || rk === 'hunter' || rk === 'guard' || rk === 'knight' || rk === 'muteElder' || rk === 'dreamweaver';
  }
  function nightmareBlocksKill() {
    if (boardType !== 'nightmare') return false;
    if (nightmareFearTarget == null) return false;
    return isWolfFactionNum(nightmareFearTarget) && !isDead(nightmareFearTarget);
  }
  function awardScore(num, points, reason) {
    if (num == null) return;

  function resolveNightDeaths() {
    // Roll back previously resolved night deaths in this round
    // (handles user going back and changing night actions)
    while (deadPlayers.length > roundStartDeadCount) {
      deadPlayers.pop();
    }
    // 清空本回合“无技能出局”标记（梦游出局 / 跟随摄梦人出局）
    dreamNoSkillDead = [];
    const dwNum = boardType === 'nightmare' ? getAssigned('dreamweaver') : null;
    const dwFeared = boardType === 'nightmare' && nightmareFearTarget === dwNum;
    const dreamer = boardType === 'nightmare' ? dreamTarget : null;
    const dreamerImmune = dreamer != null && dreamer !== 0;
    const fearBlocksKill = nightmareBlocksKill();
    const guardTarget = guardProtectTarget;
    const mechShield = mechNightAction && mechNightAction.type === 'shield' ? mechNightAction.target : null;
    // 机械狼学狼人、作为最后一只狼首次双刀时，第一刀无视守卫守护
    const mechFirstKillPierces = isMechDoubleKill();
    // 连续两晚梦游同一人 → 梦游出局（无技能）；摄梦人被恐惧则中断，不触发
    const consecutiveDreamOut = boardType === 'nightmare' && !dwFeared && dreamerImmune && dreamer === lastDreamTarget;

    if (killTarget) {
      const isGuarded = !mechFirstKillPierces && killTarget === guardTarget;
      const isSaved = witchSaveAction === 'save';
      const isDreamImmune = dreamerImmune && killTarget === dreamer;
      // 噩梦之影恐惧狼人 → 狼队无法袭击；梦游者免疫夜伤 → 不结算狼刀
      if (fearBlocksKill || isDreamImmune) {
        // 空刀 / 梦游者免死
      }
      // 同守同救: guard AND witch on same target -> still dies (unless mech guard shields)
      else if (isGuarded && isSaved && killTarget !== mechShield) { addDeath(killTarget); }
      else if (!isGuarded && killTarget !== mechShield && !isSaved) { addDeath(killTarget); }
    }
    if (mechExtraKill) addDeath(mechExtraKill);
    if (witchPoisonTarget && witchHasPoison) {
      if (dreamerImmune && witchPoisonTarget === dreamer) {
        // 梦游者免疫夜伤，毒不死
      } else if (witchPoisonTarget === mechShield) {
        const wn = getAssigned('witch');
        if (wn != null) addDeath(wn);
        witchHasPoison = false;
      } else {
        addDeath(witchPoisonTarget);
      }
    }
    if (mechNightAction && mechNightAction.type === 'poison') addDeath(mechNightAction.target);
    // 连续两晚梦游 → 梦游者梦游出局（无技能）
    if (consecutiveDreamOut) {
      addDeath(dreamer);
      if (dreamNoSkillDead.indexOf(dreamer) < 0) dreamNoSkillDead.push(dreamer);
    }
    // 摄梦人死于夜间伤害 → 当晚梦游者跟随出局（无技能）
    if (boardType === 'nightmare' && dwNum != null && isDead(dwNum) && dreamerImmune && !isDead(dreamer) && dreamer !== dwNum) {
      addDeath(dreamer);
      if (dreamNoSkillDead.indexOf(dreamer) < 0) dreamNoSkillDead.push(dreamer);
    }

  // ─── Grid renderer ──────────────────────────────────────────
  // config: { grayedNums, disabledNums, selectedNums, selectedClass, multiLabel }
  // - grayedNums: explicit numbers to gray out (already assigned to other roles)
  // - disabledNums: extra numbers to make unclickable
  // - selectedNums: numbers to highlight
  // - selectedClass: CSS class for selected ('selected'|'kill-target'|'learn-target')
  // - multiLabel: if set, shows a multi-select remaining badge
  function renderGrid(cfg) {
    const grayed = new Set(cfg.grayedNums || []);
    const disabled = new Set(cfg.disabledNums || []);
    const selected = new Set(cfg.selectedNums || []);
    const selClass = cfg.selectedClass || 'selected';

    let html = '';
    if (cfg.multiLabel) {
      html += '<div class="multi-count">' + cfg.multiLabel + '</div>';
    }

    html += '<div class="number-grid">';
    for (let i = 1; i <= TOTAL; i++) {
      let cls = 'number-btn';
      let label = '';

      if (disabled.has(i)) {
        cls += ' disabled';
      } else if (grayed.has(i)) {
        cls += ' assigned';
        const rk = assignments[i];
        const ri = ROLES[rk];
        if (ri) label = ri.label;
      } else if (selected.has(i)) {
        cls += ' ' + selClass;
      } else {
        cls += ' available';
      }

      html += `<div class="${cls}" data-num="${i}">${i}`;
      if (label) html += `<div class="role-label">${label}</div>`;
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

    if (boardType === 'nightmare') {

      render() { if (!banishedPlayer || !canShootAsHunter(banishedPlayer)) return '<div class="action-card" style="text-align:center;padding:20px"><div class="card-label">被放逐的玩家不是猎人，无需开枪</div></div>'; let h = renderGrid({ grayedNums: [banishedPlayer, ...deadPlayers], selectedNums: hunterShotTarget ? [hunterShotTarget] : undefined, selectedClass: 'kill-target' }); if (hunterShotTarget) { h += '<div class="kill-info" style="margin-top:12px"><div class="kill-label">猎人开枪带走</div><div class="kill-value">' + hunterShotTarget + ' 号 (' + getRoleDisplay(hunterShotTarget) + ')</div></div>'; } return h; },
      handleSelect(num) { if (num === banishedPlayer) return; hunterShotTarget = num; if (!isDead(num)) addDeath(num); render(currentStep); },
    });

    return s;
  }

  // ─── Navigation ─────────────────────────────────────────────
  function render(idx) {
    currentStep = idx;
    const step = steps[idx];
    if (!step) return;

    // Auto-skip conditional steps (e.g. hunter step when banished is not hunter)
    if (step.autoSkip && step.autoSkip()) {
      const next = idx + 1;
      if (next >= steps.length) {
        advanceAfterDay();
      } else {
        render(next);
      }
      return;
    }

    const total = steps.length;
    document.getElementById('progressFill').style.width = ((idx + 1) / total * 100) + '%';
    document.getElementById('progressStep').textContent = '步骤 ' + (idx + 1) + ' / ' + total;
    document.getElementById('progressRole').textContent = round > 1 ? '第' + round + '轮 ' + step.title : step.title;

    const desc = typeof step.desc === 'function' ? step.desc() : step.desc;
    document.getElementById('stepSubtitle').textContent = step.subtitle;
    document.getElementById('stepTitle').textContent = step.title;
    document.getElementById('stepDesc').textContent = desc;

    document.getElementById('contentArea').innerHTML = step.render();

    // Show wolf suicide button during day phase (after dawn)
    const suicideBtn = document.getElementById('wolfSuicideBtn');
    if (suicideBtn) {
      suicideBtn.style.display = isDayPhase ? 'block' : 'none';
    }
    // Show knight duel button only for muteElder board during day phase
    const knightBtn = document.getElementById('knightDuelBtn');
    if (knightBtn) {
      knightBtn.style.display = (boardType === 'muteElder' && isDayPhase) ? 'block' : 'none';
    }

    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    btnPrev.disabled = idx === 0;
    btnNext.disabled = !step.canProceed();
    btnNext.textContent = '下一步';
    btnNext.style.display = 'block';
  }

  function recordNightPhase() {
    const nightDeaths = deadPlayers.slice(roundStartDeadCount);
    const existing = gameLog.find(e => e.round === round);
    if (existing) return;
    gameLog.push({
      round: round,
      night: {
        wolfKill: killTarget,
        mechLearn: round === 1 ? learnTarget : null,
        mechNightAction: mechNightAction ? { type: mechNightAction.type, target: mechNightAction.target } : null,
        mechExtraKill: mechExtraKill,
        seerCheck: seerCheckTarget,
        witchSave: witchSaveAction,
        witchPoison: witchPoisonTarget,
        guardProtect: guardProtectTarget,
        muteTarget: mechNightAction && mechNightAction.type === 'mute' ? mechNightAction.target : null,
        dreamTarget: dreamTarget,
        nightmareFearTarget: nightmareFearTarget,
        deaths: nightDeaths,
      },
      day: null
    });
  }

  function recordDayPhase() {
    const nightDeaths = gameLog.find(e => e.round === round)?.night?.deaths || [];
    const dayDeaths = [];
    if (banishedPlayer && !nightDeaths.includes(banishedPlayer)) dayDeaths.push(banishedPlayer);
    if (wolfSuicide && typeof wolfSuicide === 'number' && !nightDeaths.includes(wolfSuicide)) dayDeaths.push(wolfSuicide);
    if (wolfKingShotTarget && !nightDeaths.includes(wolfKingShotTarget)) dayDeaths.push(wolfKingShotTarget);
    if (hunterShotTarget && !nightDeaths.includes(hunterShotTarget)) dayDeaths.push(hunterShotTarget);
    if (hunterRevengeTarget && !nightDeaths.includes(hunterRevengeTarget)) dayDeaths.push(hunterRevengeTarget);
    if (mechChainShotTarget && !nightDeaths.includes(mechChainShotTarget)) dayDeaths.push(mechChainShotTarget);
    if (mechHunterRevengeTarget && !nightDeaths.includes(mechHunterRevengeTarget)) dayDeaths.push(mechHunterRevengeTarget);
    if (knightDuelTarget && !nightDeaths.includes(knightDuelTarget)) dayDeaths.push(knightDuelTarget);
    const existing = gameLog.find(e => e.round === round);
    if (existing) {
      existing.day = {
        onBoard: round === 1 ? onBoard.slice() : null,
        sheriff: round === 1 ? sheriff : null,
        sheriffVoters: round === 1 ? sheriffVoters.slice() : null,
        banished: banishedPlayer,
        wolfKingShot: wolfKingShotTarget,
        whiteWolfKingShot: whiteWolfKingShotTarget,
        hunterShot: hunterShotTarget,
        hunterRevenge: hunterRevengeTarget,
        mechChainShot: mechChainShotTarget,
        mechHunterRevenge: mechHunterRevengeTarget,
        knightDuel: knightDuelTarget,
        wolfSuicide: wolfSuicide,
        deaths: dayDeaths,
      };
    }
  }

  function advanceAfterDay() {
    recordDayPhase();
    addDeath(banishedPlayer);
    if (wolfSuicide && typeof wolfSuicide === 'number' && !isDead(wolfSuicide)) addDeath(wolfSuicide);
    if (wolfKingShotTarget) addDeath(wolfKingShotTarget);
    if (whiteWolfKingShotTarget) addDeath(whiteWolfKingShotTarget);
    if (hunterShotTarget) addDeath(hunterShotTarget);
    if (hunterRevengeTarget) addDeath(hunterRevengeTarget);
    if (mechChainShotTarget) addDeath(mechChainShotTarget);
    if (mechHunterRevengeTarget) addDeath(mechHunterRevengeTarget);
    // 追踪摄梦人连续梦游（被恐惧 / 死亡则中断，需重新累计）
    if (boardType === 'nightmare') {
      const dw = getAssigned('dreamweaver');
      const dwFeared = nightmareFearTarget === dw;
      if (dw != null && !isDead(dw) && !dwFeared && dreamTarget != null && dreamTarget !== 0) {
        lastDreamTarget = dreamTarget;
      } else {
        lastDreamTarget = null;
      }
    }
    // Sync permanent potion state from this round's actions
    if (witchSaveAction === 'save') witchHasSave = false;
    if (witchPoisonTarget) witchHasPoison = false;
    scoreDayActions();
    const result = checkGameOver();
    if (result) { scoreGameEnd(); showGameOver(result); return; }
    round++;
    resetPerRoundState();
    steps = buildSteps();
    render(0);
  }

  function showGameOver(winner) {
    gameWinner = winner;
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressStep').textContent = '游戏结束';
    document.getElementById('progressRole').textContent = winner === 'good' ? '好人获胜' : '狼人获胜';
    document.getElementById('stepSubtitle').textContent = '';
    document.getElementById('stepTitle').textContent = winner === 'good' ? '好人阵营获胜！' : '狼人阵营获胜！';
    document.getElementById('stepDesc').textContent = '';
    document.getElementById('btnPrev').disabled = true;
    document.getElementById('btnNext').style.display = 'none';
    document.getElementById('wolfSuicideBtn').style.display = 'none';
    document.getElementById('knightDuelBtn').style.display = 'none';
    document.getElementById('wolfSuicideOverlay').classList.remove('open');
    document.getElementById('knightDuelOverlay').classList.remove('open');

    // ─── MVP calculation ──────────────────────────────────────────
    let maxScore = 0;
    for (let i = 1; i <= TOTAL; i++) {
      if ((scores[i] || 0) > maxScore) maxScore = scores[i] || 0;
    }
    let mvpCandidates = [];
    for (let i = 1; i <= TOTAL; i++) {
      if ((scores[i] || 0) === maxScore && maxScore > 0) mvpCandidates.push(i);
    }
    let mvps = [];
    if (mvpCandidates.length === 1) {
      mvps = mvpCandidates;
    } else if (mvpCandidates.length > 1) {
      // Multiple tied for max — pick those on the winning team
      const winningTeamTypes = winner === 'good' ? ['god', 'good'] : ['wolf'];
      mvps = mvpCandidates.filter(n => {
        const rk = assignments[n];
        return rk && ROLES[rk] && winningTeamTypes.includes(ROLES[rk].type);
      });
      // If filtering leaves empty (shouldn't happen), fallback to all tied
      if (mvps.length === 0) mvps = mvpCandidates;
    }
    // ─── MVP section ──────────────────────────────────────────────
    let mvpSection = '';
    if (mvps.length > 0) {
      const isCoMvp = mvps.length > 1;
      mvpSection = '<div class="mvp-section">';
      mvpSection += '<div class="mvp-crown"><svg viewBox="0 0 48 48" fill="none"><path d="M24 6L29 18L42 18L32 26L36 40L24 32L12 40L16 26L6 18L19 18L24 6Z" fill="#d4a853" opacity="0.9"/><path d="M24 10L27 18H21L24 10Z" fill="#f0e6d3" opacity="0.4"/></svg></div>';
      mvpSection += '<div class="mvp-label">M V P</div>';
      if (isCoMvp) {
        mvpSection += '<div class="mvp-co-label">共同当选</div>';
        mvpSection += '<div class="mvp-divider"></div>';
      }
      mvpSection += '<div class="mvp-names">';
      for (const n of mvps) {
        const name = nameBindings[n] || n + '号';
        mvpSection += '<div class="mvp-name-tag"><span class="num">' + n + '</span><span class="name-text">' + name + '</span><span class="mvp-badge">MVP</span></div>';
      }
      mvpSection += '</div></div>';
    }

    let html = '<div class="result-section">';
    html += mvpSection;
    html += '<div class="result-summary">';
    html += '<div class="result-summary-item"><span class="label">获胜方</span><span class="value">' + (winner === 'good' ? '好人' : '狼人') + '</span></div>';
    html += '<div class="result-summary-item"><span class="label">游戏轮数</span><span class="value">第 ' + round + ' 轮</span></div>';
    html += '<div class="result-summary-item"><span class="label">出局玩家</span><span class="value">' + (deadPlayers.length ? deadPlayers.sort((a,b)=>a-b).join(', ') : '无') + ' 号</span></div>';
    const totalScore = Object.values(scores).reduce((a,b) => a + b, 0);
    html += '<div class="result-summary-item" style="border-bottom:none"><span class="label">总分</span><span class="value" style="color:#d4a853">' + totalScore + ' 分</span></div>';
    html += '</div>';

    html += '<div style="margin:16px 0 8px;font-size:14px;font-weight:700;color:#d4a853">操作记录</div>';
    html += buildGameLogHTML();

    const seer = getAssigned('seer'); const witch = getAssigned('witch');
    const hunter = getAssigned('hunter'); const guard = getAssigned('guard');
    const wolves = getAssignedAll('wolf'); const mech = getAssigned('mech');
    const wolfKing = getAssigned('wolfKing');
    const villagers = getAssignedAll('villager');

    html += '<table class="role-table"><thead><tr><th>号码</th><th>姓名</th><th>身份</th><th>阵营</th><th>状态</th><th>积分</th><th>胜负分</th></tr></thead><tbody>';
    for (let i = 1; i <= TOTAL; i++) {
      const rk = assignments[i]; const ri = ROLES[rk];
      const ts = ri ? TYPE_STYLES[ri.type] : { cls: '', label: '' };
      let display = ri ? ri.label : '?';
                  if (rk === 'mech' && learnTarget) display += ' (学' + getRoleDisplay(learnTarget) + ')';
      if (rk === 'whiteWolfKing') display = '白狼王';
      if (rk === 'whiteWolfKing') display = '白狼王';
      let ws = 0;
      if (ri) {
        if (gameWinner === 'good') {
          if (ri.type === 'good') ws = 1;
          else if (ri.type === 'god') ws = 2;
          else if (ri.type === 'wolf') ws = -3;
        } else if (gameWinner === 'wolf') {
          if (ri.type === 'good') ws = -1;
          else if (ri.type === 'god') ws = -2;
          else if (ri.type === 'wolf') ws = 3;
        }
      }
      html += '<tr' + (mvps.includes(i) ? ' class="mvp-row"' : '') + '><td><span class="player-num">' + i + '</span></td>'
           + '<td style="color:#aaa;font-size:13px">' + (nameBindings[i] || '-') + '</td>'
           + '<td><span class="' + ts.cls + '">' + display + '</span></td>'
           + '<td>' + ts.label + '</td>'
           + '<td>' + (isDead(i) ? '<span style="color:#e74c3c">出局</span>' : '<span style="color:#2ecc71">存活</span>') + (mvps.includes(i) ? ' <span style="display:inline-block;padding:1px 5px;border-radius:4px;background:#d4a853;color:#1a1a2e;font-size:10px;font-weight:800;letter-spacing:0.5px;vertical-align:middle">MVP</span>' : '') + '</td>'
           + '<td style="color:#d4a853;font-weight:700">' + (scores[i] || 0) + '</td>'
           + '<td style="color:' + (ws > 0 ? '#2ecc71' : ws < 0 ? '#e74c3c' : '#888') + ';font-weight:700">' + (ws > 0 ? '+' : '') + ws + '</td></tr>';
    }
    html += '</tbody></table>';

    html += '<button class="btn-img" id="generateImgBtn">生成总结图片</button>';
    html += '<button class="sync-btn" id="syncToSheetBtn">📊 同步到表格</button>';
    html += '<button class="reset-btn" id="resetBtn">重新记录</button>';
    html += '</div>';
    document.getElementById('contentArea').innerHTML = html;
    document.getElementById('resetBtn').addEventListener('click', resetApp);
    document.getElementById('generateImgBtn').addEventListener('click', generateSummaryImage);
    document.getElementById('syncToSheetBtn').addEventListener('click', openSyncDialog);
  }

  // ─── Sync to Tencent Docs Sheet ─────────────────────────────
  // [Sync state]
  let syncPlan = null; // { sheetId, title, nextRound, nextCol, nameToRow, lastPlayerRow, resultRow, resultFormat, players }

  function apiGet(path) {
    return fetch(TD_BASE + '/' + path, { method: 'GET', headers: TD_AUTH })
      .then(function(r) { return r.json(); });
  }

  function apiPost(path, body) {
    return fetch(TD_BASE + '/' + path, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, TD_AUTH),
      body: JSON.stringify(body)
    }).then(function(r) { return r.json(); });
  }

  // ── Step 1: open dialog, list sheets ──────────────────────────
  function openSyncDialog() {
    if (!gameWinner) { alert('游戏尚未结束，无法同步'); return; }
    var container = document.getElementById('syncContent');
    container.innerHTML = '<div class="state-overlay-inner"><h2 style="font-size:18px;font-weight:700;color:#d4a853;margin-bottom:16px;text-align:center">同步到表格</h2>'
      + '<div class="sync-status loading">正在加载表格列表...</div></div>';
    document.getElementById('syncOverlay').classList.add('open');

    apiGet(TD_FILE_ID + '?concise=1').then(function(res) {
      if (!res.properties) {
        container.innerHTML = '<div class="state-overlay-inner"><h2 style="font-size:18px;font-weight:700;color:#d4a853;margin-bottom:16px;text-align:center">同步到表格</h2>'
          + '<div class="sync-status error">加载失败：' + (res.message || res.msg || '未知错误') + '<br><small>请确认 Access-Token 是否过期</small></div></div>';
        return;
      }
      var sheets = res.properties;
      var h = '<div class="state-overlay-inner"><h2 style="font-size:18px;font-weight:700;color:#d4a853;margin-bottom:16px;text-align:center">同步到表格</h2>';
      h += '<div style="font-size:13px;color:#888;margin-bottom:12px;text-align:center">请选择目标子表</div>';
      h += '<div class="sync-sheet-list">';
      for (var i = 0; i < sheets.length; i++) {
        var s = sheets[i];
        // Skip rule-sheet (the one with 大师赛 得分算法 in title)
        h += '<div class="sync-sheet-item" data-idx="' + i + '"><div class="sheet-title">' + s.title + '</div><div class="sheet-meta">'
          + s.rowTotal + ' 行 × ' + s.columnTotal + ' 列  |  sheetId: ' + s.sheetId + '</div></div>';
      }
      h += '</div>';
      h += '<div id="syncPreviewArea"></div>';
      h += '</div>';
      container.innerHTML = h;
      container._sheets = sheets;
      var items = container.querySelectorAll('.sync-sheet-item');
      for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('click', function() {
          selectSheetForSync(parseInt(this.getAttribute('data-idx')));
        });
      }
    }).catch(function(err) {
      container.innerHTML = '<div class="state-overlay-inner"><h2 style="font-size:18px;font-weight:700;color:#d4a853;margin-bottom:16px;text-align:center">同步到表格</h2>'
        + '<div class="sync-status error">网络错误：' + err.message + '</div></div>';
    });
  }

  // ── Step 2: load full sheet, analyse structure ────────────────
  function selectSheetForSync(idx) {
    var container = document.getElementById('syncContent');
    var sheet = container._sheets[idx];
    // Highlight
    var items = container.querySelectorAll('.sync-sheet-item');
    for (var i = 0; i < items.length; i++) { items[i].classList.remove('active'); }
    items[idx].classList.add('active');

    var previewArea = document.getElementById('syncPreviewArea');
    previewArea.innerHTML = '<div class="sync-status loading">正在读取表格结构...</div>';

    apiGet(TD_FILE_ID + '/' + sheet.sheetId + '/A1:Z300').then(function(res) {
      analyseSheetAndBuildPreview(sheet, res);
    }).catch(function(err) {
      previewArea.innerHTML = '<div class="sync-status error">读取表格失败：' + err.message + '<br><small>请检查网络连接</small></div>';
    });
  }

  // ── Step 3: parse header / players / result-row ───────────────
  function analyseSheetAndBuildPreview(sheet, res) {
    var previewArea = document.getElementById('syncPreviewArea');

    // Guard: valid response?
    if (!res || !res.gridData || !res.gridData.rows || res.gridData.rows.length === 0) {
      previewArea.innerHTML = '<div class="sync-status error">表格数据为空或读取失败<br><small>请检查 Access-Token 是否有效、表格是否有权限</small></div>';
      return;
    }

    var rows = res.gridData.rows;
    var headerVals = (rows[0] && rows[0].values) || [];

    // Find last round column and next round number
    var lastRoundCol = -1, nextRoundNum = 1;
    for (var c = 0; c < headerVals.length; c++) {
      var cv = headerVals[c] && headerVals[c].cellValue;
      if (cv && cv.text && /^r\d+$/.test(cv.text)) {
        var rn = parseInt(cv.text.substring(1));
        if (rn >= nextRoundNum) { nextRoundNum = rn + 1; lastRoundCol = c; }
      }
    }
    // No rounds yet → start from column C (index 2), r1
    if (lastRoundCol < 0) { lastRoundCol = 1; nextRoundNum = 1; }
    var nextCol = lastRoundCol + 1;
    var nextRound = 'r' + nextRoundNum;

    // Scan data rows: build name→row map, find last player row, find result row
    var nameToRow = {};
    var lastPlayerRow = 0;
    var resultRow = -1;
    var resultFormat = 'wolf'; // 'wolf' = 狼人赢 / 'wolfShort' = 狼赢

    for (var r = 1; r < rows.length; r++) {
      var rowVals = rows[r] && rows[r].values;
      if (!rowVals) continue;

      // Check if this is a result/annotation row: column C+ has "赢" text
      var col2 = rowVals[2] && rowVals[2].cellValue;
      if (col2 && col2.text && (col2.text.indexOf('赢') >= 0 || col2.text.indexOf('第三方') >= 0)) {
        if (resultRow < 0) {
          resultRow = r;
          // Detect format: "狼人赢" vs "狼赢"
          if (col2.text.indexOf('狼人赢') >= 0 || col2.text.indexOf('第三方') >= 0) resultFormat = 'wolf';
          else if (col2.text.indexOf('狼赢') >= 0) resultFormat = 'wolfShort';
        }
        continue;
      }

      // Player row: column A has a non-empty name
      var col0 = rowVals[0] && rowVals[0].cellValue;
      if (col0 && col0.text && col0.text.trim()) {
        var nm = col0.text.trim();
        nameToRow[nm] = r;
        if (r > lastPlayerRow) lastPlayerRow = r;
      }
    }

    // Fixed result row: always row 25
    resultRow = 24; // spreadsheet row 25 (0-based index)

    // ── Build player score list from current game ─────────────────
    var players = [];
    for (var i = 1; i <= TOTAL; i++) {
      var ri = assignments[i];
      var rk = ROLES[ri];
      var ws = 0;
      if (rk && gameWinner) {
        if (gameWinner === 'good') {
          if (rk.type === 'good') ws = 1;
          else if (rk.type === 'god') ws = 2;
          else if (rk.type === 'wolf') ws = -3;
        } else if (gameWinner === 'wolf') {
          if (rk.type === 'good') ws = -1;
          else if (rk.type === 'god') ws = -2;
          else if (rk.type === 'wolf') ws = 3;
        }
      }
      var nm = nameBindings[i] || (i + '号');
      players.push({ num: i, name: nm, score: ws, exists: (nm in nameToRow) });
    }

    // Sort: existing first, then new players
    players.sort(function(a, b) { return (a.exists === b.exists) ? 0 : a.exists ? -1 : 1; });

    // Compute max row of existing game players only (ignore annotation rows)
    var existingMaxRow = 0;
    for (var k = 0; k < players.length; k++) {
      if (players[k].exists) {
        var r = nameToRow[players[k].name];
        if (r > existingMaxRow) existingMaxRow = r;
      }
    }

    // Determine game result text
    var resultText;
    if (gameWinner === 'good') resultText = '好人赢';
    else if (resultFormat === 'wolfShort') resultText = '狼赢';
    else resultText = '狼人赢';

    // ── Build preview HTML ────────────────────────────────────────
    var colLetter = colToLetter(nextCol);
    var h = '<div class="sync-preview"><div style="font-size:14px;font-weight:600;color:#d4a853;margin-bottom:8px">📋 数据预览</div>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:4px">写入列：<b>' + colLetter + '</b>（' + nextRound + '） | '
      + '玩家 ' + players.length + ' 人 | 已有 ' + players.filter(function(p){return p.exists;}).length + ' 人 | '
      + '新增 ' + players.filter(function(p){return !p.exists;}).length + ' 人</div>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:4px">结果行 R' + (resultRow + 1) + '：「' + resultText + '」</div>';
    h += '<table><thead><tr><th>姓名</th><th>号码</th><th>胜负分</th><th>状态</th></tr></thead><tbody>';
    for (var p = 0; p < players.length; p++) {
      var pl = players[p];
      var sc = pl.score > 0 ? 'score-pos' : pl.score < 0 ? 'score-neg' : '';
      var rc = pl.exists ? '' : 'new-player';
      h += '<tr class="' + rc + '"><td>' + pl.name + '</td><td>' + pl.num + '</td><td class="' + sc + '">'
        + (pl.score > 0 ? '+' : '') + pl.score + '</td><td>' + (pl.exists ? '已有' : '🆕 新增') + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += '<div class="sync-confirm-row">';
    h += '<button class="reset-btn" id="syncCancelBtn" style="border-color:#888;color:#888">取消</button>';
    h += '<button class="btn-img" id="syncConfirmBtn" style="border-color:#d4a853;color:#d4a853">确认同步</button>';
    h += '</div>';
    h += '<div class="sync-status" id="syncStatus"></div>';

    previewArea.innerHTML = h;

    // Save plan
    syncPlan = {
      sheetId: sheet.sheetId, title: sheet.title,
      nextRound: nextRound, nextCol: nextCol,
      nameToRow: nameToRow, existingMaxRow: existingMaxRow, resultRow: resultRow,
      players: players, resultText: resultText
    };

    document.getElementById('syncCancelBtn').addEventListener('click', function() {
      document.getElementById('syncOverlay').classList.remove('open');
    });
    document.getElementById('syncConfirmBtn').addEventListener('click', doSync);
  }

  // ── Step 4: execute writes (block-based, max 5 requests) ──────
  function colToLetter(c) { return String.fromCharCode(65 + c); }

  function doSync() {
    var btn = document.getElementById('syncConfirmBtn');
    var statusEl = document.getElementById('syncStatus');
    if (!syncPlan) return;
    btn.disabled = true; btn.textContent = '同步中...';
    statusEl.className = 'sync-status loading'; statusEl.textContent = '正在写入数据...';

    var d = syncPlan;
    var nc = d.nextCol;

    // Gather all score writes: { row → value }
    var sw = {};
    sw[0] = d.nextRound;
    for (var k = 0; k < d.players.length; k++) {
      var pl = d.players[k];
      var row;
      if (pl.exists) { row = d.nameToRow[pl.name]; }
      else {
        if (d._newIdx === undefined) d._newIdx = d.existingMaxRow + 1;
        row = d._newIdx; d._newIdx++;
      }
      sw[row] = pl.score;
      if (!pl.exists) {
        if (!d._newNames) d._newNames = {};
        d._newNames[row] = pl.name;
      }
    }
    sw[d.resultRow] = d.resultText;

    // ── Build operation detail JSON for each player ──────────────
    var opData = {};
    for (var i = 1; i <= TOTAL; i++) {
      var nm = nameBindings[i] || (i + '号');
      var playerLogs = [];
      for (var j = 0; j < scoreLog.length; j++) {
        if (scoreLog[j].playerNum === i) {
          playerLogs.push((scoreLog[j].points > 0 ? '+' : '') + scoreLog[j].points + ' ' + scoreLog[j].reason);
        }
      }
      opData[nm] = { os: scores[i] || 0, operationLine: playerLogs.join(', '), role: (assignments[i] && ROLES[assignments[i]] ? ROLES[assignments[i]].label : '?') };
    }
    sw[d.resultRow + 1] = JSON.stringify(opData);

    // Write range: header → max(resultRow+1, last assigned row)
    var endRow = d.resultRow + 1;
    if (d._newIdx !== undefined) endRow = Math.max(endRow, d._newIdx - 1);
    var allRows = [];
    for (var r = 0; r <= endRow; r++) {
      var v = sw[r];
      if (typeof v === 'string') {
        allRows.push({ values: [{ cellValue: { text: v } }] });
      } else if (typeof v === 'number') {
        allRows.push({ values: [{ cellValue: { number: v } }] });
      } else {
        allRows.push({ values: [{}] });
      }
    }
    var requests = [{
      updateRangeRequest: { sheetId: d.sheetId, gridData: { startRow: 0, startColumn: nc, rows: allRows } }
    }];

    // New player names + total score (cols A & B)
    if (d._newNames) {
      var nids = Object.keys(d._newNames).map(Number).sort(function(a, b) { return a - b; });
      var nrsA = [], nrsB = [];
      for (var ni = 0; ni < nids.length; ni++) {
        var r = nids[ni];
        nrsA.push({ values: [{ cellValue: { text: d._newNames[r] } }] });
        nrsB.push({ values: [{ cellValue: { number: sw[r] } }] });
      }
      // Column A: names
      requests.push({
        updateRangeRequest: { sheetId: d.sheetId, gridData: { startRow: nids[0], startColumn: 0, rows: nrsA } }
      });
      // Column B: 总分
      requests.push({
        updateRangeRequest: { sheetId: d.sheetId, gridData: { startRow: nids[0], startColumn: 1, rows: nrsB } }
      });
    }

    console.log('Sync: ' + requests.length + ' requests for ' + d.nextRound);

    apiPost(TD_FILE_ID + '/batchUpdate', { requests: requests }).then(function(res) {
      btn.disabled = false; btn.textContent = '确认同步';
      if (res.responses || res.code === 0 || res.ret === 0) {
        statusEl.className = 'sync-status success';
        statusEl.textContent = '✅ 同步成功！' + d.nextRound + ' 已写入表格「' + d.title + '」';
      } else {
        statusEl.className = 'sync-status error';
        statusEl.textContent = '同步失败：' + (res.message || res.msg || JSON.stringify(res));
      }
    }).catch(function(err) {
      btn.disabled = false; btn.textContent = '确认同步';
      statusEl.className = 'sync-status error';
      statusEl.textContent = '网络错误：' + err.message;
    });
  }

    }

    return html;

      { key: 'wolf', title: '🐺 狼人阵营',        cls: 'role-tag-wolf' },
    ];
    let html = '<div class="state-overlay-inner"><div class="result-section">';
    html += '<h2 style="font-size:18px;font-weight:700;color:#d4a853;margin-bottom:16px;text-align:center">角色简介</h2>';
    html += '<div class="rules-section">';
    for (const g of groups) {
      const roles = order.filter(k => ROLES[k] && ROLES[k].type === g.key);
      if (roles.length === 0) continue;
      html += '<div class="rule-category">';
      html += '<div class="rule-cat-title">' + g.title + '</div>';
      for (const k of roles) {
        const r = ROLES[k];
        const skill = ROLE_SKILLS[k] || '';
        html += '<div class="role-info-card">';
        html += '<div class="role-info-head"><span class="role-info-name">' + r.label + '</span><span class="role-info-count ' + g.cls + '">×' + r.count + '</span></div>';
        if (skill) html += '<div class="role-info-skill">' + skill + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div></div></div>';
    document.getElementById('overlayContent').innerHTML = html;
    document.getElementById('stateOverlay').classList.add('open');
  }

  document.getElementById('infoBtn').addEventListener('click', openOverlay);
  document.getElementById('roleInfoBtn').addEventListener('click', openRoleInfo);
  document.getElementById('rulesBtn').addEventListener('click', openRules);
  document.getElementById('overlayClose').addEventListener('click', function() {
    document.getElementById('stateOverlay').classList.remove('open');
  });
  document.getElementById('stateOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  var lastRandomNum = 0;
  document.getElementById('randomBtn').addEventListener('click', function() {
    var alive = getAliveNums();
    if (alive.length === 0) return;
    var num;
    if (alive.length === 1) {
      num = alive[0];
    } else {
      do { num = alive[Math.floor(Math.random() * alive.length)]; } while (num === lastRandomNum && alive.length > 1);
    }
    lastRandomNum = num;
    var dirLabel = Math.random() < 0.5 ? '⬆ 正序' : '⬇ 倒序';
    var existing = document.getElementById('randomPopup');
    if (existing) existing.remove();
    var popup = document.createElement('div');
    popup.id = 'randomPopup';
    popup.innerHTML = '<div class="random-popup-num">' + num + '</div><div class="random-popup-range">' + dirLabel + '</div>';
    popup.addEventListener('click', function() { this.remove(); });
    document.body.appendChild(popup);
  });

  // ─── Name binding dialog ──────────────────────────────────────
  function renderNameBindDialog() {
    const boundNames = new Set(Object.values(nameBindings));
    let html = '<div class="state-overlay-inner">';

    // Add name input
    html += '<div style="display:flex;gap:8px;margin-bottom:16px">';
    html += '<input id="newNameInput" placeholder="输入新名字" style="flex:1;padding:10px 14px;border-radius:8px;border:1px solid #3a3a5a;background:rgba(255,255,255,0.06);color:#e0e0e0;font-size:14px;outline:none">';
    html += '<button id="addNameBtn" class="close-btn">添加</button>';
    html += '</div>';

    // Name pool
    html += '<div style="margin-bottom:8px;font-size:13px;color:#888">名字池（点击名字选中，再点号码绑定）</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">';
    for (const name of namePool) {
      const isBound = boundNames.has(name);
      const isSelected = selectedNameForBind === name;
      let cls = 'name-tag';
      let style = 'padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.2s;';
      if (isSelected) {
        style += 'border:2px solid #d4a853;background:rgba(212,168,83,0.2);color:#d4a853';
      } else if (isBound) {
        style += 'border:1px solid #3a3a5a;background:rgba(255,255,255,0.04);color:#666;opacity:0.6';
      } else {
        style += 'border:1px solid #3a3a5a;background:rgba(255,255,255,0.06);color:#e0e0e0';
      }
      html += '<span class="' + cls + '" data-name="' + name + '" style="' + style + '">' + name + '</span>';
    }
    html += '</div>';

    // Selected name indicator
    html += '<div style="margin-bottom:12px;font-size:14px;color:#d4a853;font-weight:600">当前选中: ' + (selectedNameForBind || '无') + '</div>';

    // Current bindings
    const entries = Object.entries(nameBindings).sort(function(a,b) { return a[0]-b[0]; });
    if (entries.length > 0) {
      html += '<div style="margin-bottom:8px;font-size:13px;color:#888">已绑定:</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
      for (const [seat, name] of entries) {
        html += '<span style="padding:4px 10px;border-radius:6px;background:rgba(212,168,83,0.1);border:1px solid rgba(212,168,83,0.3);font-size:13px;color:#d4a853">' + seat + '号 → ' + name + ' <span class="unbind-name" data-seat="' + seat + '" style="color:#e74c3c;cursor:pointer;margin-left:6px;font-weight:700">✕</span></span>';
      }
      html += '</div>';
    } else {
      html += '<div style="margin-bottom:16px;font-size:13px;color:#555">暂无绑定，请从名字池选择名字再点击号码</div>';
    }

    // Seat grid for binding
    html += '<div style="margin-bottom:8px;font-size:13px;color:#888">点击号码绑定</div>';
    html += '<div class="number-grid">';
    for (let i = 1; i <= TOTAL; i++) {
      const bn = nameBindings[i];
      let cls = 'number-btn';
      let label = '';
      if (bn) {
        cls += ' selected';
        label = bn;
      } else {
        cls += ' available';
      }
      html += '<div class="' + cls + '" data-bind-num="' + i + '">' + i;
      if (label) html += '<div class="role-label" style="font-size:10px">' + label + '</div>';
      html += '</div>';
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  function openNameBindDialog() {
    selectedNameForBind = null;
    document.getElementById('nameBindContent').innerHTML = renderNameBindDialog();
    document.getElementById('nameBindOverlay').classList.add('open');
  }

  function addNameFromInput() {
    const input = document.getElementById('newNameInput');
    if (!input) return;
    const name = input.value.trim();
    if (name && namePool.indexOf(name) < 0) {
      namePool.push(name);
      input.value = '';
      document.getElementById('nameBindContent').innerHTML = renderNameBindDialog();
    }
  }

  document.getElementById('nameBindBtn').addEventListener('click', openNameBindDialog);
  document.getElementById('nameBindClose').addEventListener('click', function() {
    document.getElementById('nameBindOverlay').classList.remove('open');
  });
  document.getElementById('nameBindOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.getElementById('nameBindOverlay').addEventListener('click', function(e) {
    const nameTag = e.target.closest('.name-tag');
    if (nameTag) {
      const name = nameTag.dataset.name;
      selectedNameForBind = selectedNameForBind === name ? null : name;
      document.getElementById('nameBindContent').innerHTML = renderNameBindDialog();
      return;
    }

    const bindNumBtn = e.target.closest('[data-bind-num]');
    if (bindNumBtn) {
      const num = parseInt(bindNumBtn.dataset.bindNum);
      if (selectedNameForBind) {
        nameBindings[num] = selectedNameForBind;
        selectedNameForBind = null;
      } else if (nameBindings[num]) {
        delete nameBindings[num];
      }
      document.getElementById('nameBindContent').innerHTML = renderNameBindDialog();
      return;
    }

    const unbindBtn = e.target.closest('.unbind-name');
    if (unbindBtn) {
      const seat = parseInt(unbindBtn.dataset.seat);
      delete nameBindings[seat];
      document.getElementById('nameBindContent').innerHTML = renderNameBindDialog();
      return;
    }

    if (e.target.id === 'addNameBtn') {
      addNameFromInput();
    }
  });
  document.getElementById('nameBindOverlay').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.id === 'newNameInput') {
      e.preventDefault();
      addNameFromInput();
    }
  });

  // ─── Event binding ──────────────────────────────────────────

  // Click via event delegation
  document.getElementById('contentArea').addEventListener('click', function(e) {
    // Action buttons
    const actBtn = e.target.closest('.action-btn');
    if (actBtn && !actBtn.disabled) {
      const act = actBtn.getAttribute('data-act');
      if (act) { const s = steps[currentStep]; if (s && s.handleAction) { s.handleAction(act); return; } }
    }

    // Standard number grid buttons (data-num)
    const numBtn = e.target.closest('.number-btn');
    if (!numBtn) return;
    if (numBtn.classList.contains('assigned') || numBtn.classList.contains('disabled')) return;
    const num = parseInt(numBtn.dataset.num);
    if (isNaN(num)) return;
    const step = steps[currentStep];
    if (step && step.handleSelect) step.handleSelect(num);
  });

  document.getElementById('btnPrev').addEventListener('click', function() {
    if (currentStep > 0) render(currentStep - 1);
  });

  // Wolf suicide button handler
  document.getElementById('wolfSuicideBtn').addEventListener('click', function() {
    if (!isDayPhase) return;
    // Build number grid showing only wolf faction players (alive)
    let html = '';
    let wolfNums = [];
    for (let i = 1; i <= TOTAL; i++) {
      const rk = assignments[i];
      if ((rk === 'wolf' || rk === 'wolfKing' || rk === 'whiteWolfKing' || rk === 'nightmare') && !isDead(i)) wolfNums.push(i);
    }
    for (const num of wolfNums) {
      const rk = assignments[num];
      const ri = ROLES[rk];
      let label = ri ? ri.label : '';
      let display = num + '<div class="role-label" style="color:' + (rk === 'mech' || rk === 'wolfKing' || rk === 'nightmare' ? '#9b59b6' : '#e74c3c') + '">' + label + '</div>';
      html += '<div class="number-btn" data-num="' + num + '">' + display + '</div>';
    }
    document.getElementById('suicideGrid').innerHTML = html;
    document.getElementById('wolfSuicideOverlay').classList.add('open');
  });

  // Wolf suicide modal number selection
  document.getElementById('suicideGrid').addEventListener('click', function(e) {
    const numBtn = e.target.closest('.number-btn');
    if (!numBtn) return;
    const num = parseInt(numBtn.dataset.num);
    if (isNaN(num)) return;
    // Trigger wolf suicide
    document.getElementById('wolfSuicideOverlay').classList.remove('open');
    wolfSuicide = num;
    // If white wolf king self-detonates, show target selection
    if (boardType === 'whitewolfking' && assignments[num] === 'whiteWolfKing') {
      showWWKTargetOverlay();
    } else {
      advanceAfterDay();
    }
  });

  // Wolf suicide cancel
  document.getElementById('suicideCancel').addEventListener('click', function() {
    document.getElementById('wolfSuicideOverlay').classList.remove('open');
  });

  // Knight duel button handler (muteElder board, day phase only)
  document.getElementById('knightDuelBtn').addEventListener('click', function() {
    if (boardType !== 'muteElder' || !isDayPhase) return;
    const kn = getAssigned('knight');
    if (!kn || isDead(kn)) { alert('骑士已阵亡，无法决斗'); return; }
    // Build grid of all alive players except the knight
    let html = '';
    for (let i = 1; i <= TOTAL; i++) {
      if (isDead(i) || i === kn) continue;
      const rk = assignments[i];
      const ri = ROLES[rk];
      let label = ri ? ri.label : '?';
      let display = i + '<div class="role-label">' + label + '</div>';
      html += '<div class="number-btn" data-num="' + i + '">' + display + '</div>';
    }
    document.getElementById('knightDuelGrid').innerHTML = html;
    document.getElementById('knightDuelOverlay').classList.add('open');
  });

  // Knight duel grid selection
  document.getElementById('knightDuelGrid').addEventListener('click', function(e) {
    const numBtn = e.target.closest('.number-btn');
    if (!numBtn) return;
    const num = parseInt(numBtn.dataset.num);
    if (isNaN(num)) return;
    document.getElementById('knightDuelOverlay').classList.remove('open');
    const kn = getAssigned('knight');
    knightDuelTarget = num;
    if (isWolfFactionNum(num)) {
      addDeath(num);
      scoreDayActions();
      // Duel succeeded: skip banishment, go straight to night
      advanceAfterDay();
    } else {
      addDeath(kn);
      scoreDayActions();
      render(currentStep); // refresh current view, day continues
    }
  });

  // Knight duel cancel
  document.getElementById('knightDuelCancel').addEventListener('click', function() {
    document.getElementById('knightDuelOverlay').classList.remove('open');
  });

  document.getElementById('knightDuelOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  // White wolf king target selection
  function showWWKTargetOverlay() {
    // Build grid of all alive non-wolf players (白狼王只能带走好人)
    let html = '';
    for (let i = 1; i <= TOTAL; i++) {
      if (isDead(i)) continue;
      if (i === wolfSuicide) continue;
      const rk = assignments[i];
      if (rk === 'wolf' || rk === 'wolfKing' || rk === 'whiteWolfKing') continue;
      const ri = ROLES[rk];
      let label = ri ? ri.label : '?';
      let display = i + '<div class="role-label">' + label + '</div>';
      html += '<div class="number-btn" data-num="' + i + '">' + display + '</div>';
    }
    document.getElementById('wwkTargetGrid').innerHTML = html;
    document.getElementById('wwkTargetOverlay').classList.add('open');
  }

  document.getElementById('wwkTargetGrid').addEventListener('click', function(e) {
    const numBtn = e.target.closest('.number-btn');
    if (!numBtn) return;
    const num = parseInt(numBtn.dataset.num);
    if (isNaN(num)) return;
    document.getElementById('wwkTargetOverlay').classList.remove('open');
    whiteWolfKingShotTarget = num;
    advanceAfterDay();
  });

  document.getElementById('wwkTargetCancel').addEventListener('click', function() {
    document.getElementById('wwkTargetOverlay').classList.remove('open');
    wolfSuicide = null;
  });

  document.getElementById('wwkTargetOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('open');
      wolfSuicide = null;
    }
  });

  // Click outside modal to close
  document.getElementById('wolfSuicideOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  document.getElementById('btnNext').addEventListener('click', function() {
    const step = steps[currentStep];
    if (!step || !step.canProceed()) return;
    // Game over check — if win condition is met, go straight to results
    if (gameWinner) { showGameOver(gameWinner); return; }
    let next = currentStep + 1;
    if (next >= steps.length) {
      advanceAfterDay();
      return;
    }
    render(next);
  });

  // ─── Board selection ─────────────────────────────────────────
  function switchBoard(board) {
    if (board === boardType) return;
    document.getElementById('boardSelectOverlay').classList.remove('open');
    initRoles(board);
    document.getElementById('boardTitle').textContent = board === 'wolfking' ? '狼王守卫' : board === 'whitewolfking' ? '白狼王' : board === 'muteElder' ? '禁言长老' : board === 'nightmare' ? '梦魇' : '机械狼';
    document.title = '狼人杀(' + (board === 'wolfking' ? '狼王守卫' : board === 'whitewolfking' ? '白狼王' : board === 'muteElder' ? '禁言长老' : board === 'nightmare' ? '梦魇' : '机械狼') + ')';
    resetApp();
  }

  document.getElementById('boardSelectBtn').addEventListener('click', function() {
    // Update active state on option buttons
    const btns = document.querySelectorAll('#boardSelectContent [data-board]');
    btns.forEach(function(b) {
      if (b.dataset.board === boardType) {
        b.classList.add('active');
        b.style.borderColor = '#d4a853';
        b.style.background = 'rgba(212,168,83,0.2)';
        b.style.color = '#d4a853';
      } else {
        b.classList.remove('active');
        b.style.borderColor = '#3a3a5a';
        b.style.background = 'rgba(255,255,255,0.04)';
        b.style.color = '#ccc';
      }
    });
    document.getElementById('boardSelectOverlay').classList.add('open');
  });

  document.getElementById('boardSelectContent').addEventListener('click', function(e) {
    const boardBtn = e.target.closest('[data-board]');
    if (boardBtn) {
      switchBoard(boardBtn.dataset.board);
    }
  });

  document.getElementById('boardSelectClose').addEventListener('click', function() {
    document.getElementById('boardSelectOverlay').classList.remove('open');
  });

  document.getElementById('boardSelectOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  // ─── Init ───────────────────────────────────────────────────
  steps = buildSteps();
  render(0);
})();
</script>
</body>
</html>
